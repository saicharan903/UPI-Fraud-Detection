<!DOCTYPE html>
<html>
<head>
  <title>UPI Fraud Predictor</title>
  <style>
    body {
      font-family: Arial;
      margin: 30px;
      background-color: #f4f4f4;
    }

    h2 {
      text-align: center;
    }

    .form-container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 600px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .submit-btn {
      background-color: #28a745;
      color: white;
      border: none;
      margin-top: 20px;
      cursor: pointer;
    }

    .submit-btn:hover {
      background-color: #218838;
    }

    .result {
      margin-top: 20px;
      text-align: center;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <h2>UPI Fraud Prediction Form</h2>
  <div class="form-container">
    <form method="POST" action="/predict">
      
      <label>Amount (INR):</label>
      <input type="number" step="0.01" name="amount_(inr)" placeholder="Enter transaction amount">

      <label>Sender Age Group:</label>
      <input type="number" name="sender_age_group" placeholder="e.g. 30">

      <label>Receiver Age Group:</label>
      <input type="number" name="receiver_age_group" placeholder="e.g. 25">

      <label>Hour of Day (0-23):</label>
      <input type="number" name="hour_of_day" min="0" max="23">

      <label>Is Weekend:</label>
      <select name="is_weekend">
        <option value="1">Yes</option>
        <option value="0">No</option>
      </select>

      <label>Transaction Type:</label>
      <select name="transaction_type_p2p">
        <option value="true">P2P</option>
        <option value="false">Not P2P</option>
      </select>

      <label>Merchant Category (Food):</label>
      <select name="merchant_category_food">
        <option value="true">Yes</option>
        <option value="false">No</option>
      </select>

      <label>Sender Bank (SBI):</label>
      <select name="sender_bank_sbi">
        <option value="true">Yes</option>
        <option value="false">No</option>
      </select>

      <label>Receiver Bank (HDFC):</label>
      <select name="receiver_bank_hdfc">
        <option value="true">Yes</option>
        <option value="false">No</option>
      </select>

      <label>Device Type (Web):</label>
      <select name="device_type_web">
        <option value="true">Yes</option>
        <option value="false">No</option>
      </select>

      <label>Network Type (4G):</label>
      <select name="network_type_4g">
        <option value="true">Yes</option>
        <option value="false">No</option>
      </select>

      <input type="submit" value="Predict" class="submit-btn">
    </form>

    {% if pred is not none %}
    <div class="result">
      <h3>Prediction: {{ pred }} (0 = Not Fraud, 1 = Fraud)</h3>
      <h3>Fraud Probability: {{ prob }}</h3>
    </div>
    {% endif %}
  </div>
</body>
</html>
